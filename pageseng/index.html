  --ink:#0E1116; --panel:#171B21; --panel-2:#1E232B; --panel-3:#252B34; --line:#2A313B; --line-soft:#222831;
  --txt:#E7EAEE; --dim:#8B939F; --dim-2:#5C6470; --accent:#D6FB41; --accent-ink:#1A2000;
  --danger:#FF5E5E; --warn:#FFB546; --cold:#4DD0E1; --radius:6px;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--ink);color:var(--txt);display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none !important}

header{height:42px;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:100}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:600;font-size:13.5px;letter-spacing:.06em;margin-right:6px;white-space:nowrap}
.brand svg{width:15px;height:15px;flex-shrink:0;display:block}
.brand small{font-weight:400;color:var(--dim);font-size:10.5px}
#menubar{display:flex;align-items:center;gap:0;height:100%}
.menu-root{position:relative;padding:5px 8px;border-radius:4px;font-size:13px;cursor:default;min-height:30px;display:flex;align-items:center}
.menu-root:hover,.menu-root.open{background:var(--panel-3)}
.menu-pop{position:absolute;top:calc(100% + 3px);left:0;min-width:236px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:4px;box-shadow:0 12px 34px rgba(0,0,0,.55);z-index:400;max-height:calc(100dvh - 60px);overflow:auto}
.mi{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:4px;font-size:13px;white-space:nowrap;cursor:default;position:relative}
.mi:hover{background:var(--panel-3)}
.mi .chk{width:13px;flex-shrink:0;color:var(--accent);font-size:11px;text-align:center}
.mi .lab{flex:1;padding-right:14px}
.mi .kbd{color:var(--dim-2);font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.mi .subarrow{color:var(--dim-2);font-size:10px}
.mi-sep{height:1px;background:var(--line);margin:4px 6px}
.mi.has-sub>.menu-pop{display:none;left:calc(100% - 4px);top:-5px}
.mi.has-sub:hover>.menu-pop{display:block}
.tb-spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:2px 6px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--txt);border-color:var(--dim-2)}
.chip .dot{width:6px;height:6px;background:var(--accent)}

#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px 8px;font-size:12.5px;color:var(--dim);min-height:42px}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#tabs button:hover{color:var(--txt)}

#stage{flex:1;position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#dgm,#hsvg{width:100%;height:100%;display:block;touch-action:none}
#dgm{cursor:grab}
#dgmInfo{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim);pointer-events:none;line-height:1.5}
#camWrap{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,#1E232B,#0B0D10 70%);overflow:hidden}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent}
#cam{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#camStatus{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 16px);pointer-events:none}
#camStatus .chip{background:rgba(14,17,22,.78);cursor:default;pointer-events:none}
#camBar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;background:linear-gradient(transparent,rgba(14,17,22,.82) 40%)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-size:12.5px;min-height:40px;min-width:40px}
.btn:hover{background:var(--panel-3)}
.btn.on,.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:4px 9px;min-height:30px;font-size:12px}
#camBar .btn{background:rgba(23,27,33,.9)}
#camBar .btn.on{background:var(--accent)}

#vHor{display:none;flex-direction:column}
#vHor.on{display:flex}
#hsvgWrap{flex:0 0 46%;min-height:150px;position:relative;border-bottom:1px solid var(--line)}
#horPanel{flex:1;overflow:auto;padding:8px 10px;min-height:0}
.rowf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
#horList{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.pt{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;padding:3px 4px 3px 8px;font-family:var(--mono);font-size:11.5px}
.pt span{flex:1}
.pt button{background:none;border:0;color:var(--dim);font-size:15px;min-width:30px;min-height:30px}
.pt button:hover{color:var(--danger)}
.empty{color:var(--dim);font-size:12.5px;line-height:1.5;padding:6px 2px}

#hoursScroll{position:absolute;inset:0;overflow:auto;padding:10px 12px 18px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
h3{font-size:11.5px;font-weight:600;color:var(--dim);margin:14px 0 6px;letter-spacing:.04em}
h3:first-child{margin-top:0}
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:5px 0;border-bottom:1px solid var(--line-soft)}
table.kv td:last-child{text-align:right;font-family:var(--mono);color:var(--accent)}
#heat{width:100%;display:block;touch-action:none;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
#mbars{width:100%;display:block}

#dock{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px 8px}
#readout{display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-bottom:4px;line-height:1.5}
#readout b{color:var(--accent);font-weight:600}
#readout .dn{color:var(--cold)}
.drow{display:flex;align-items:center;gap:6px;margin-top:2px}
.drow input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:30px}
.drow .btn{padding:4px 9px;min-height:34px}
.drow .val{font-family:var(--mono);font-size:12px;min-width:44px;text-align:right}
input[type=date],input[type=number],input[type=text],select{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-height:34px;font-size:13px;user-select:text;-webkit-user-select:text}
input[type=date]{color-scheme:dark;font-family:var(--mono);font-size:12px;max-width:128px}

.modal{position:fixed;inset:0;background:rgba(5,7,10,.72);z-index:600;display:flex;align-items:center;justify-content:center;padding:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:6px 6px 0 rgba(0,0,0,.45)}
.box.wide{width:min(760px,100%)}
.box h2{font-size:14px;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.box h2 button{background:none;border:0;font-size:20px;color:var(--dim);min-width:34px;min-height:34px}
.mbody{padding:12px 14px;overflow:auto;font-size:13px;line-height:1.55;user-select:text;-webkit-user-select:text}
.mfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.fgrid label{color:var(--dim);font-size:12.5px}
.fgrid input,.fgrid select{width:100%}
.hint{color:var(--dim);font-size:12px;line-height:1.5;margin-top:8px}
.mbody h4{font-size:13px;color:var(--accent);margin:16px 0 4px;font-weight:600}
.mbody h4:first-child{margin-top:0}
.mbody p{margin:4px 0}
.mbody ul{margin:4px 0 4px 18px}
.mbody li{margin:2px 0}
.mbody code{font-family:var(--mono);font-size:12px;background:var(--ink);border:1px solid var(--line-soft);padding:0 4px;border-radius:3px}
#helpToc{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
#helpToc a{font-size:11.5px;color:var(--txt);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:3px 7px;cursor:pointer}
#helpToc a:hover{border-color:var(--accent);color:var(--accent)}
.ok{color:var(--accent)} .ko{color:var(--danger)} .wr{color:var(--warn)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--line);border-left:3px solid var(--accent);padding:9px 14px;border-radius:5px;font-size:12.5px;z-index:700;max-width:min(92vw,460px);box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
#toast.err{border-left-color:var(--danger)}

@media (max-width:640px){
  .mi.has-sub>.menu-pop{position:static;display:none;box-shadow:none;border:0;padding:0 0 0 14px;background:transparent;max-height:none;overflow:visible}
  .mi.has-sub:hover>.menu-pop{display:none}
  .mi.has-sub.open>.menu-pop{display:block}
  .mi.has-sub{flex-wrap:wrap}
  .mi.has-sub>.menu-pop{flex-basis:100%}
  #chipNet{display:none}
  .menu-pop{min-width:min(280px,calc(100vw - 12px))}
}
@media (max-height:520px){ #dock{padding:3px 8px 4px} #readout{font-size:10.5px;margin-bottom:0} .drow .btn{min-height:28px;padding:2px 8px} .drow input[type=range]{height:22px} }
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
